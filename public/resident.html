<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/validation.css">
  <link rel="stylesheet" href="/sidebar.css">
  <link rel="stylesheet" href="/resident-sidebar.css">
  <link rel="stylesheet" href="/custom.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
  <title>HostelCare - Resident</title>
</head>
<body>
  <div class="app">

    <!-- ===== RESIDENT SIDEBAR ===== -->
    <aside class="side" id="sd">

      <!-- Logo (resident.js lagata hai) -->
      <div id="logo-box"></div>

      <!-- Menu. Naya item chahiye to ek <a> line copy karke add kar do -->
      <a class="on" data-page="Dashboard"><i data-ic="grid"></i>Dashboard</a>
      <a data-page="New Complaint"><i data-ic="plus"></i>New Complaint</a>
      <a data-page="My Complaints"><i data-ic="file"></i>My Complaints</a>
      <a data-page="History"><i data-ic="clock"></i>History</a>
      <a data-page="Notice Board"><i data-ic="mega"></i>Notice Board</a>
      <a data-page="Notifications"><i data-ic="bell"></i>Notifications</a>
      <a data-page="Change Password"><i data-ic="key"></i>Change Password</a>

      <!-- Sidebar ke neeche resident ka naam aur room -->
      <div class="side-foot">
        <b id="side-name">Resident</b>
        <small id="side-room">Resident</small>
      </div>

    </aside>

    <div class="main" id="main">

      <!-- Top bar -->
      <div class="top">
        <button class="ham" title="Menu" onclick="document.getElementById('sd').classList.toggle('open')"><span data-ic="menu" data-size="22"></span></button>
        <b>Resident portal</b>

 
    
 
 <span class="sp">
 </span>
        <span class="bell" id="bell" title="Notifications" onclick="go('Notifications')"></span>
        <div class="av" id="av"></div>
        <div class="who nm"><span id="top-name"></span><small id="top-room"></small></div>
        <button class="btn sm o" title="Log out" onclick="logout()"><span data-ic="out" data-size="15"></span> Log out</button>
      </div>

      <!-- Yahan har page ka content aata hai -->
      <div class="cont" id="content"></div>

    </div>

  </div>
  <script src="/app.js"></script>
  <script src="/validation.js"></script>
  <script src="/resident.js"></script>
</body>
</html>
