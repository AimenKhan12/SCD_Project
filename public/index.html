<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/base.css">
    <link rel="stylesheet" href="/landing-nav.css">
  <title>HostelCare - Hostel Complaint Management</title>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header" id="site-header">
    <div class="site-nav">

      <!-- Logo (landing-icons.js lagata hai). Click karne par Home par jata hai -->
      <a class="site-logo" href="#home" data-logo aria-label="HostelCare home"></a>

      <!-- Menu links. Naya link chahiye to ek <a> line copy karke add kar do -->
      <nav class="site-links" id="site-links">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#how">How it works</a>
        <a href="#contact">Contact</a>
      </nav>

      <!-- Login button: login.html kholta hai. Text badalna ho to "Login" badlo -->
      <a class="btn sm" id="login-btn" href="/login.html"><span data-ic="user"></span> <span id="login-text">Login</span></a>

      <!-- Mobile menu button (sirf chhoti screen par dikhta hai) -->
      <button class="site-menu-btn" id="menu-btn" type="button" aria-label="Menu"><span data-ic="menu" data-size="22"></span></button>

    </div>
  </header>
    <!-- ===== HERO (pehla section) ===== -->
  <main>
    <section class="home-hero" id="home">
      <div class="home-blob one"></div>
      <div class="home-blob two"></div>

      <div class="home-hero-inner">
        <div class="home-hero-text">
          <span class="home-pill">Hostel Complaint Management</span>
          <h1 class="home-title">Hostel complaints, <span class="home-gradient">sorted in a tap.</span></h1>
          <p class="home-text">Report a problem, get the right staff member automatically, and follow it to Resolved with live notifications.</p>

          <!-- Dono buttons. Text badalna ho to sirf text badlo -->
          <div class="home-buttons">
            <a class="btn" href="/login.html"><span data-ic="key"></span> Get started</a>
            <a class="btn o" href="#contact"><span data-ic="mail"></span> Contact desk</a>
          </div>
        </div>

        <!-- Phone yahan aayega (agle step mein) -->
      </div>
    </section>

    <!-- Aage ke sections (About, How it works, Contact) yahan aayenge -->
  </main>
  <script src="/app.js"></script>
  <script src="/landing-icons.js"></script>
    <script src="/landing-nav.js"></script>
      <link rel="stylesheet" href="/landing-hero.css">
</body>
</html>
