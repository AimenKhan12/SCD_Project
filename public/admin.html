<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/validation.css">
  <link rel="stylesheet" href="/sidebar.css">
  <link rel="stylesheet" href="/admin-sidebar.css">
  <link rel="stylesheet" href="/admin-main.css">
  <title>HostelCare - Admin Panel</title>
</head>
<body>

  <div class="app">

    <!-- ===== ADMIN SIDEBAR ===== -->
    <aside class="side" id="sd">

      <!-- Logo (admin-sidebar.js lagata hai) -->
      <div id="logo-box"></div>

      <!-- Menu. Naya item chahiye to ek <a> line copy karke add kar do -->
      <a class="on" data-page="Dashboard"><i data-ic="grid"></i>Dashboard</a>
      <a data-page="All Complaints"><i data-ic="folder"></i>All Complaints</a>
      <a data-page="Manage Staff"><i data-ic="users"></i>Manage Staff</a>
      <a data-page="Reports"><i data-ic="chart"></i>Reports</a>
      <a data-page="Notice Board"><i data-ic="mega"></i>Notice Board</a>
      <a data-page="Notifications"><i data-ic="bell"></i>Notifications</a>
      <a data-page="Change Password"><i data-ic="key"></i>Change Password</a>

      <!-- Sidebar ke neeche admin ka naam -->
      <div class="side-foot">
        <b id="side-name">Admin</b>
        <small>Administrator</small>
      </div>

    </aside>

    <!-- ===== BEECH WALA HISSA ===== -->
    <div class="main" id="main">

      <!-- Top bar -->
      <div class="top">
        <button class="ham" onclick="document.getElementById('sd').classList.toggle('open')">&#9776;</button>
        <b>Admin portal</b>
        <span class="sp"></span>
        <span class="bell" id="bell" onclick="showPage('Notifications')"></span>
        <div class="av" id="av"></div>
        <div class="who nm"><span id="top-name"></span><small>Admin</small></div>
        <button class="btn sm o" onclick="logout()">Log out</button>
      </div>

      <!-- Yahan har page ka content aata hai -->
      <div class="cont" id="content"></div>

    </div>

  </div>

  <!-- Scripts. Order should be fixes-->
  <script src="/app.js"></script>
  <script src="/validation.js"></script>
  <script src="/admin-sidebar.js"></script>
  <script src="/admin-pages.js"></script>
</body>
</html>
